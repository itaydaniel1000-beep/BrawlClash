<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>סרטונים</title>
<meta name="theme-color" content="#0d0f1a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="הפורטל" />
<link rel="stylesheet" href="category.css?v=4" />
<style>
  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 22px;
  }
  .video-item {
    background: var(--card);
    border: 1px solid #262e4d;
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .video-item video {
    width: 100%;
    display: block;
    background: #000;
    aspect-ratio: 16 / 9;
    object-fit: contain;
  }
  .video-item .meta {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .video-item .meta .ico { font-size: 1.4rem; }
  .video-item .meta h3 { font-size: 1.05rem; font-weight: 700; }
  .section-label {
    display: flex; align-items: center; gap: 10px;
    font-size: 1.15rem; font-weight: 800; color: var(--text);
    margin: 6px 0 16px;
  }
  .section-label .line { flex: 1; height: 1px; background: linear-gradient(90deg, #2c3556, transparent); }
  .section-block { margin-bottom: 34px; }
</style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="back" href="index.html">→ חזרה</a>
      <span class="title"><span class="emoji">🎬</span> סרטונים</span>
    </div>

    <!-- קבוצה חופשית — כולם רואים, בלי קוד -->
    <div class="section-block">
      <div class="section-label">🔓 הדרכות (לכולם)<span class="line"></span></div>
      <div class="video-grid" id="free-grid"></div>
    </div>

    <!-- קבוצה פרטית — דורש קוד 102 -->
    <div class="section-block">
      <div class="section-label">🔒 הסרטונים שלי<span class="line"></span></div>
      <div class="video-grid" id="grid"></div>
    </div>
  </div>

  <script src="access.js?v=4"></script>
  <script>
    // סרטונים חופשיים — מוצגים תמיד, בלי קוד גישה
    const FREE_VIDEOS = [
      { src: "videos/tutorial-brawl.mp4", title: "איך משחקים ב-PixelArena", ico: "🎓" },
    ];

    // סרטונים פרטיים — מאחורי קוד 102
    const VIDEOS = [
      { src: "videos/vid1.mp4", title: "סרטון 1" },
      { src: "videos/vid2.mp4", title: "סרטון 2" },
      { src: "videos/vid3.mp4", title: "סרטון 3" },
      { src: "videos/vid4.mp4", title: "סרטון 4" },
      { src: "videos/vid5.mp4", title: "סרטון 5" },
      { src: "videos/vid6.mp4", title: "סרטון 6" },
      { src: "videos/vid7.mp4", title: "סרטון 7" },
      { src: "videos/vid8.mp4", title: "סרטון 8" },
    ];

    function videoCard(v) {
      return `
        <div class="video-item">
          <video controls preload="metadata" playsinline>
            <source src="${v.src}#t=0.1" type="video/mp4" />
            הדפדפן שלך לא תומך בנגן הווידאו.
          </video>
          <div class="meta">
            <span class="ico">${v.ico || "🎬"}</span>
            <h3>${v.title}</h3>
          </div>
        </div>`;
    }

    // חופשי — מיד
    document.getElementById("free-grid").innerHTML = FREE_VIDEOS.map(videoCard).join("");

    // פרטי — דורש קוד גישה 102
    function renderVideos() {
      document.getElementById("grid").innerHTML = VIDEOS.map(videoCard).join("");
    }
    AccessGate.guard(document.getElementById("grid"), "videos", renderVideos);
  </script>
  <script src="cookies.js?v=4"></script>
</body>
</html>
