name: WhatsApp Saver APK

on:
  push:
    paths:
      - "whatsapp-saver/**"
      - "!whatsapp-saver/download/**"
      - ".github/workflows/whatsapp-saver-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-saver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-saver-apk
          path: whatsapp-saver/app/build/outputs/apk/debug/app-debug.apk
      # שומר את ה-APK בענף כדי שיהיה קישור הורדה ישיר (בלי zip)
      - name: Publish APK to branch
        run: |
          mkdir -p download
          cp app/build/outputs/apk/debug/app-debug.apk download/WhatsAppSaver.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/WhatsAppSaver.apk
          git diff --cached --quiet || git commit -m "WhatsApp Saver: update downloadable APK"
          git push
